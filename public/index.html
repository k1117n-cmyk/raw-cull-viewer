<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAW Cull Viewer</title>
    <link rel="stylesheet" href="/styles.css?v=27" />
  </head>
  <body>
    <main class="shell">
      <section class="viewer" aria-label="RAW preview">
        <button class="nav nav-left" id="prev" type="button" title="前へ">
          <span aria-hidden="true">‹</span>
        </button>
        <div class="stage" id="stage">
          <img id="preview" alt="" />
          <div class="empty" id="empty">画像フォルダを読み込み中</div>
          <a class="debug-link" id="debugLink" href="#" target="_blank" rel="noreferrer">preview</a>
        </div>
        <button class="nav nav-right" id="next" type="button" title="次へ">
          <span aria-hidden="true">›</span>
        </button>
      </section>

      <aside class="panel">
        <div class="topline">
          <div>
            <div class="label">Folder</div>
            <div class="root" id="root">-</div>
            <select class="folder-select" id="folderSelect" title="フォルダ選択"></select>
            <div class="version">viewer v27</div>
          </div>
          <button id="reload" type="button" title="再読み込み">R</button>
        </div>

        <div class="meta">
          <div class="counter" id="counter">0 / 0</div>
          <div class="filename" id="filename">-</div>
          <div class="details" id="details">-</div>
        </div>

        <div class="actions">
          <button class="danger" id="delete" type="button" title="Dキーで削除">Delete</button>
          <button id="undo" type="button" title="Uキーで取り消し">Undo</button>
        </div>

        <div class="strip" id="strip" aria-label="Files"></div>
      </aside>
    </main>
    <script src="/app.js?v=27"></script>
  </body>
</html>
